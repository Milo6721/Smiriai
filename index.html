<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>funnn.site - gry w klockowym stylu</title>
<meta name="description" content="Gry 3D w klockowym stylu, które działają od razu w przeglądarce: tycoon, parkour, wyścigi i łucznictwo.">
<meta name="theme-color" content="#7CC8FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A3A" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="funnn.site">
<meta property="og:description" content="Gry 3D w klockowym stylu. Klikasz i grasz.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='44' rx='9' fill='%23FF4F8B' stroke='%2316213A' stroke-width='5'/%3E%3Crect x='16' y='4' width='12' height='10' rx='3' fill='%23FF4F8B' stroke='%2316213A' stroke-width='4'/%3E%3Crect x='36' y='4' width='12' height='10' rx='3' fill='%23FF4F8B' stroke='%2316213A' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --line:#16213A; --text:#16213A; --muted:#44527A; --card:#FFFFFF;
  --sky1:#7CC8FF; --sky2:#DDF3FF; --cloud:rgba(255,255,255,.85);
  --pink:#FF4F8B; --yellow:#FFC93C; --green:#3DDC84; --blue:#4F9DFF; --purple:#9B6BFF; --orange:#FF9A3C;
  --focus:#FF4F8B;
  color-scheme: light dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{ --line:#060C22; --text:#F2F6FF; --muted:#AAB9E0; --card:#1B2A58; --sky1:#0C1634; --sky2:#1F3270; --cloud:rgba(255,255,255,.07); }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font:800 16px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(var(--sky1),var(--sky2)) fixed;position:relative;overflow-x:hidden}
html.playing,html.playing body{overflow:hidden;overscroll-behavior:none}
a{color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* clouds */
.cloud{position:absolute;pointer-events:none;background:var(--cloud);border-radius:999px}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:999px}
.cloud::before{width:44%;height:130%;left:14%;top:-60%}
.cloud::after{width:34%;height:110%;left:50%;top:-40%}
.c1{width:190px;height:44px;left:-30px;top:120px}
.c2{width:150px;height:36px;right:6%;top:70px}
.c3{width:230px;height:52px;right:-50px;top:520px}

/* page */
.wrap{position:relative;max-width:1080px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) clamp(16px,4vw,40px) calc(env(safe-area-inset-bottom) + 40px)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 28px}
.logo{margin:0;display:flex;align-items:flex-end;gap:clamp(6px,1.4vw,12px);font-weight:400}
.lt{--s:clamp(54px,12.5vw,92px);position:relative;display:grid;place-items:center;width:var(--s);height:var(--s);margin-top:14px;
  font:400 calc(var(--s)*.78)/1 "Lilita One",sans-serif;color:#fff;background:var(--c);border:4px solid var(--line);border-radius:16px;box-shadow:0 8px 0 var(--line);
  -webkit-text-stroke:3px var(--line);paint-order:stroke fill;transform:rotate(var(--r));animation:drop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d)}
.lt::before,.lt::after{content:"";position:absolute;top:-15px;width:26%;height:11px;background:var(--c);border:4px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0}
.lt::before{left:16%}.lt::after{right:16%}
.dotsite{font:400 clamp(26px,6vw,40px)/1 "Lilita One",sans-serif;padding-bottom:6px;margin-left:2px}
@keyframes drop{0%{transform:translateY(-120px) rotate(var(--r));opacity:0}60%{opacity:1}100%{transform:translateY(0) rotate(var(--r))}}
.lead{margin:20px 0 0;max-width:34ch;font-size:clamp(18px,3.4vw,22px);line-height:1.35}
.actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 22px;font:400 20px/1 "Lilita One",sans-serif;text-decoration:none;cursor:pointer;
  color:var(--text);background:var(--card);border:4px solid var(--line);border-radius:14px;box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.btn.go{background:var(--yellow);color:#16213A;padding-inline:30px}
.btn[aria-pressed="true"]{background:var(--pink);color:#fff}

/* grid of brick tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:52px 30px;margin:46px 0 0;padding:0;list-style:none}
.tile{position:relative;margin-top:14px;padding:14px;background:var(--c);border:4px solid var(--line);border-radius:24px;box-shadow:0 10px 0 var(--line)}
.studs{position:absolute;top:-17px;left:28px;display:flex;gap:18px}
.studs i{width:32px;height:13px;background:var(--c);border:4px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}
.art{position:relative;display:block;aspect-ratio:16/10;overflow:hidden;background:#8FD3FF;border:4px solid var(--line);border-radius:14px;cursor:pointer}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pv{position:absolute;left:0;top:0;border:0;background:#000;transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .5s}
.art .fallback{position:absolute;inset:0;transition:opacity .4s}
.art.live .fallback{opacity:0;pointer-events:none}
.live{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:4px 10px;font:400 14px/1 "Lilita One",sans-serif;color:#fff;background:var(--pink);border:3px solid var(--line);border-radius:999px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite}
.art.live .live{opacity:1;transform:translateY(0)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.frozen{position:absolute;inset:0;display:grid;place-items:center;gap:8px;padding:16px;text-align:center;background:color-mix(in srgb,var(--c) 22%,var(--card));opacity:0;pointer-events:none;transition:opacity .3s}
.frozen.show{opacity:1;pointer-events:auto}
.frozen span{font:400 15px/1.3 "Lilita One",sans-serif;max-width:22ch}
.frozen button{min-height:38px;padding:4px 14px;font:400 15px/1 "Lilita One",sans-serif;background:var(--card);border:3px solid var(--line);border-radius:10px;cursor:pointer}
.dot{position:absolute;right:10px;top:10px;width:16px;height:16px;border-radius:50%;background:#9AA7C7;border:3px solid var(--line)}
.dot.on{background:var(--green)}.dot.off{background:var(--pink)}
.ribbon{position:absolute;right:18px;top:-20px;padding:5px 14px;font:400 15px/1 "Lilita One",sans-serif;color:#16213A;background:var(--yellow);border:3px solid var(--line);border-radius:999px;transform:rotate(3deg)}
.label{margin-top:12px;padding:16px;background:var(--card);border:4px solid var(--line);border-radius:14px}
.label h2{margin:0;font:400 clamp(26px,5vw,32px)/1.05 "Lilita One",sans-serif}
.label p{margin:8px 0 0;color:var(--muted);max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.chips li{padding:3px 12px;font-size:14px;line-height:1.5;background:color-mix(in srgb,var(--c) 30%,var(--card));border:3px solid var(--line);border-radius:999px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}

.foot{margin:60px 0 0;color:var(--muted);font-size:15px;max-width:60ch}

/* player */
#player{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#000}
#player[hidden]{display:none}
.bar{display:flex;align-items:center;gap:10px;flex:none;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:#16213A;color:#fff;border-bottom:4px solid #060C22}
#player.barless .bar{display:none}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:2px 14px 2px 8px;font:400 19px/1 "Lilita One",sans-serif;color:#16213A;text-decoration:none;background:var(--yellow);border:3px solid #060C22;border-radius:12px}
.back svg,.ic svg{width:22px;height:22px;display:block}
.ptitle{flex:1;min-width:0;font:400 20px/1.1 "Lilita One",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px}
.ic{display:inline-grid;place-items:center;width:44px;height:40px;padding:0;color:#fff;background:#2A3A6E;border:3px solid #060C22;border-radius:12px;cursor:pointer}
.ic:active{background:#3C4F8F}
.ic[hidden]{display:none}
.stage{position:relative;flex:1;min-height:0;background:#000}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.loading{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;color:#fff;background:#0C1634;transition:opacity .3s}
.loading.done{opacity:0;pointer-events:none}
.loading h3{margin:0;font:400 clamp(24px,6vw,34px)/1.1 "Lilita One",sans-serif}
.loading p{margin:0;max-width:34ch;color:#C5D2F5}
.blocks{display:flex;gap:10px;margin-bottom:6px}
.blocks i{width:26px;height:26px;background:var(--c);border:4px solid #060C22;border-radius:7px;animation:hop .9s ease-in-out infinite}
.blocks i:nth-child(2){animation-delay:.15s}.blocks i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
.ctlbox{position:absolute;right:10px;top:10px;z-index:3;max-width:min(360px,calc(100% - 20px));padding:14px 16px;color:var(--text);background:var(--card);border:4px solid var(--line);border-radius:14px;box-shadow:0 6px 0 var(--line)}
.ctlbox[hidden]{display:none}
.ctlbox b{font:400 18px/1 "Lilita One",sans-serif}
.ctlbox p{margin:6px 0 0;color:var(--muted)}
.peek{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 8px);z-index:30;display:inline-grid;place-items:center;width:44px;height:36px;padding:0;color:#fff;background:rgba(22,33,58,.85);border:3px solid #060C22;border-radius:12px;cursor:pointer}
.peek[hidden]{display:none}
.peek svg{width:20px;height:20px}

noscript .ns{position:relative;padding:24px;max-width:600px;margin:40px auto;background:#fff;color:#16213A;border:4px solid #16213A;border-radius:16px}

@media (prefers-reduced-motion: reduce){
  .lt,.blocks i{animation:none}
  .pv,.loading{transition:none}
}
</style>
</head>
<body>
<div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div><div class="cloud c3" aria-hidden="true"></div>

<div class="wrap" id="home">
  <header class="top">
    <div>
      <h1 class="logo" aria-label="funnn.site">
        <span class="lt" style="--c:#FF4F8B;--r:-4deg;--d:0s" aria-hidden="true">f</span>
        <span class="lt" style="--c:#FFC93C;--r:3deg;--d:.08s" aria-hidden="true">u</span>
        <span class="lt" style="--c:#3DDC84;--r:-2deg;--d:.16s" aria-hidden="true">n</span>
        <span class="lt" style="--c:#4F9DFF;--r:4deg;--d:.24s" aria-hidden="true">n</span>
        <span class="lt" style="--c:#9B6BFF;--r:-3deg;--d:.32s" aria-hidden="true">n</span>
        <span class="dotsite" aria-hidden="true">.site</span>
      </h1>
      <p class="lead" id="lead">Gry 3D w klockowym stylu. Klikasz kafelek i grasz.</p>
    </div>
    <div class="actions">
      <button class="btn" id="rand" type="button">Losuj grę</button>
    </div>
  </header>

  <ul class="grid" id="grid" aria-label="Lista gier"></ul>

  <p class="foot">Gry działają w przeglądarce, bez instalowania. Postęp zapisuje się na tym urządzeniu, więc nie czyść danych strony, jeśli chcesz go zachować.</p>
</div>

<section id="player" hidden aria-label="Odtwarzacz gry">
  <div class="bar" id="bar">
    <a class="back" id="back" href="/" aria-label="Wróć do listy gier">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>funnn
    </a>
    <div class="ptitle" id="ptitle"></div>
    <div class="tools">
      <button class="ic" id="bInfo" type="button" aria-label="Sterowanie" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.2v.1"/></svg></button>
      <button class="ic" id="bReload" type="button" aria-label="Odśwież grę"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
      <button class="ic" id="bFull" type="button" aria-label="Pełny ekran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ic" id="bTab" type="button" aria-label="Otwórz w nowej karcie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      <button class="ic" id="bHide" type="button" aria-label="Ukryj pasek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    </div>
  </div>
  <div class="stage" id="stage">
    <iframe id="frame" title="Gra" allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope; clipboard-write"></iframe>
    <div class="ctlbox" id="ctlbox" hidden><b>Sterowanie</b><p id="ctltext"></p></div>
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="blocks" id="blocks" aria-hidden="true"><i></i><i></i><i></i></div>
      <h3 id="ltitle">Ładuję grę</h3>
      <p id="lmsg">To zajmie chwilę.</p>
      <div id="lacts" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center" hidden>
        <button class="btn" id="lRetry" type="button">Spróbuj ponownie</button>
        <button class="btn go" id="lTab" type="button">Otwórz w nowej karcie</button>
      </div>
    </div>
  </div>
</section>
<button class="peek" id="peek" type="button" hidden aria-label="Pokaż pasek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>

<noscript><div class="ns"><b>Włącz JavaScript, żeby grać na funnn.site.</b><p>Albo wejdź prosto do gier: <a href="https://tycoon-red.vercel.app">Tycoon</a>, <a href="https://hellnah-six.vercel.app">Skoczek</a>, <a href="https://niebo-ecru.vercel.app">Podniebny Parkour</a>, <a href="https://carride-phi.vercel.app">Pustynny Rajd</a>, <a href="https://bowshot.vercel.app">Bow Shot</a>.</p></div></noscript>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- games (nadpisywane przez /games.json) ---------- */
let games = [
  { id: 'tycoon', name: 'Klockowy Tycoon 2', desc: 'Zbuduj fabrykę, kop złoto w kopalni i odpieraj rabusiów. Uważaj na Króla Zbójów.', url: 'https://tycoon-red.vercel.app', color: '#3DDC84', art: 'tycoon', tags: ['3D', 'budowanie', 'zapis postępu'], controls: 'WASD ruch, spacja skok, F uderz (w kopalni kop), B buduj, E crafting, Q sklep. Na telefonie: joystick i przyciski.' },
  { id: 'skoczek', name: 'Skoczek: 10 Światów', desc: 'Skacz przez lawę, lód i kosmos. Zbieraj gwiazdki i odblokowuj nakrycia głowy.', url: 'https://hellnah-six.vercel.app', color: '#9B6BFF', art: 'skoczek', tags: ['3D', '10 światów', 'podwójny skok'], controls: 'WASD ruch, spacja skok (w powietrzu drugi raz), przeciągnij, żeby obrócić kamerę, R wraca na checkpoint, P pauza.' },
  { id: 'niebo', name: 'Podniebny Parkour', desc: 'Jeden tor w chmurach: ruchome platformy, wyrzutnie i lasery. Dotrzyj do pucharu.', url: 'https://niebo-ecru.vercel.app', color: '#4F9DFF', art: 'niebo', tags: ['3D', '4 etapy', 'na czas'], controls: 'WASD lub strzałki ruch, spacja skok, przeciągnij, żeby obrócić kamerę, P pauza. Na telefonie: joystick i przycisk Skok.' },
  { id: 'auta', name: 'Pustynny Rajd', desc: 'Ścigaj się z botami, driftuj i uciekaj przed czołgiem, którego nie da się pokonać.', url: 'https://carride-phi.vercel.app', color: '#FF9A3C', art: 'auta', tags: ['3D', 'kariera', 'drift i nitro'], controls: 'WASD jazda, spacja drift, Shift boost, E wysiąść z auta, R wrócić na tor, P pauza. Na telefonie: joystick, Boost, Drift i Tor.' },
  { id: 'bowshot', name: 'Bow Shot', desc: 'Strzelaj do tarcz, ścinaj drzewa, wspinaj się w góry i walcz z botami w turnieju. Uważaj na wilki i duchy.', url: 'https://bowshot.vercel.app', color: '#E8445A', art: 'bowshot', tags: ['3D', 'łuki i crafting', 'turniej z botami'], controls: 'WASD ruch, Shift bieg, spacja skok, LPM strzał (w lesie uderzenie), E sklep, warsztat, poziomy i szlaki, Q rodzaj strzały, V widok. Na telefonie: joystick, Strzel, Skok i Wejdź.' }
];
const byId = id => games.find(g => g.id === id);
const getLast = () => { try { return localStorage.getItem('funnn:last'); } catch (e) { return null; } };
const setLast = id => { try { localStorage.setItem('funnn:last', id); } catch (e) { /* ignore */ } };

/* ---------- ilustracje kafelków ---------- */
const INK = '#16213A';
const ART = {
  fallback: g => `<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Klocki"><defs><linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3FF"/><stop offset="1" stop-color="#DDF3FF"/></linearGradient></defs><rect width="320" height="200" fill="url(#gF)"/><g stroke="${INK}" stroke-width="4"><rect x="70" y="96" width="90" height="70" rx="8" fill="${esc(g.color)}"/><rect x="160" y="96" width="90" height="70" rx="8" fill="#FFC93C"/><rect x="115" y="40" width="90" height="56" rx="8" fill="#FF4F8B"/></g><g stroke="${INK}" stroke-width="4" fill="#fff"><rect x="85" y="84" width="22" height="12" rx="4"/><rect x="123" y="84" width="22" height="12" rx="4"/><rect x="175" y="84" width="22" height="12" rx="4"/><rect x="213" y="84" width="22" height="12" rx="4"/><rect x="130" y="28" width="22" height="12" rx="4"/><rect x="168" y="28" width="22" height="12" rx="4"/></g></svg>`,
  tycoon: () => `<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fabryka z taśmą, piecem i monetami"><defs><linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3FF"/><stop offset="1" stop-color="#DDF3FF"/></linearGradient></defs>
<rect width="320" height="200" fill="url(#gT)"/><rect y="128" width="320" height="72" fill="#6FCF6A"/>
<rect x="18" y="122" width="284" height="66" fill="#D9DEE8" stroke="${INK}" stroke-width="4"/>

/* ---------- routing ---------- */
function routeId() {
  const p = location.pathname.replace(/^\/+|\/+$/g, '');
  const h = location.hash.replace(/^#\/?/, '');
  return p || h || '';
}
function go(id, replace) {
  const url = id ? '/' + id : '/';
  try { history[replace ? 'replaceState' : 'pushState']({}, '', url); }
  catch (e) { location.hash = id ? '#/' + id : ''; }
  render();
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-go], a#back');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault();
  go(a.dataset.go || '');
});
addEventListener('popstate', () => render());
addEventListener('hashchange', () => render());

/* ---------- strona główna ---------- */
const plural = n => (n === 1 ? 'gra' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'gry' : 'gier'));
const NUM = ['Zero', 'Jedna', 'Dwie', 'Trzy', 'Cztery', 'Pięć', 'Sześć', 'Siedem', 'Osiem', 'Dziewięć', 'Dziesięć'];
function tileHTML(g) {
  const art = (ART[g.art] || ART.fallback)(g);
  return `<li class="tile" style="--c:${esc(g.color)}" data-id="${esc(g.id)}">
    <div class="studs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    ${getLast() === g.id ? '<span class="ribbon">Kontynuuj</span>' : ''}
    <a class="art" href="/${esc(g.id)}" data-go="${esc(g.id)}" aria-label="Graj w ${esc(g.name)}"><span class="fallback">${art}</span><span class="live">na żywo</span><div class="frozen"><span>Podgląd zatrzymany</span><button type="button" class="pvResume">Wznów</button></div><span class="dot" role="img" aria-label="Sprawdzam dostępność"></span></a>
    <div class="label">
      <h2>${esc(g.name)}</h2>
      <p>${esc(g.desc)}</p>
      <ul class="chips">${(g.tags || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <div class="row"><a class="btn go" href="/${esc(g.id)}" data-go="${esc(g.id)}">Graj</a><button class="btn pvb" type="button" aria-pressed="true">Zatrzymaj podgląd</button></div>
    </div>
  </li>`;
}
function renderHome() {
  const n = games.length;
  $('#lead').textContent = (NUM[n] || n) + ' ' + plural(n) + ' 3D w klockowym stylu. Klikasz kafelek i grasz.';
  $('#grid').innerHTML = games.map(tileHTML).join('');
  document.querySelectorAll('.tile').forEach(t => {
    const g = byId(t.dataset.id);
    ping(g, t.querySelector('.dot'));
    const btn = t.querySelector('.pvb');
    btn.addEventListener('click', () => { if (live.tile === t) stopPreview(); else startPreview(t); });
    if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
      let timer = null;
      t.addEventListener('mouseenter', () => { clearTimeout(timer); timer = setTimeout(() => startPreview(t, true), 500); });
      t.addEventListener('mouseleave', () => { clearTimeout(timer); if (live.tile === t && live.auto) stopPreview(); });
    }
  });
}
function ping(g, dot) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 6000);
  fetch(g.url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
    .then(() => { dot.className = 'dot on'; dot.setAttribute('aria-label', 'Gra działa'); dot.title = 'Gra działa'; })
    .catch(() => { dot.className = 'dot off'; dot.setAttribute('aria-label', 'Gra nie odpowiada'); dot.title = 'Gra nie odpowiada'; })
    .finally(() => clearTimeout(timer));
}

/* ---------- podgląd na żywo (jeden naraz) ---------- */
const live = { tile: null, frame: null, timer: null, auto: false };
function startPreview(tile, auto) {
  stopPreview();
  const g = byId(tile.dataset.id), art = tile.querySelector('.art'), f = document.createElement('iframe');
  const W = 1280, k = art.clientWidth / W;
  f.className = 'pv'; f.src = g.url; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.title = 'Podgląd: ' + g.name;
  f.setAttribute('sandbox', 'allow-scripts allow-same-origin'); f.setAttribute('loading', 'lazy');
  f.style.width = W + 'px'; f.style.height = (art.clientHeight / k) + 'px'; f.style.transform = 'scale(' + k + ')';
  f.addEventListener('load', () => { f.style.opacity = 1; });
  art.insertBefore(f, art.querySelector('.live'));
  art.querySelector('.live').hidden = false;
  tile.querySelector('.pvb').setAttribute('aria-pressed', 'true');
  live.tile = tile; live.frame = f; live.auto = !!auto; live.timer = setTimeout(stopPreview, 25000);
}
function stopPreview() {
  clearTimeout(live.timer);
  if (live.frame) { live.frame.src = 'about:blank'; live.frame.remove(); }
  if (live.tile) { const l = live.tile.querySelector('.live'); if (l) l.hidden = true; const b = live.tile.querySelector('.pvb'); if (b) b.setAttribute('aria-pressed', 'false'); }
  live.tile = live.frame = live.timer = null; live.auto = false;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopPreview(); });

/* ---------- losowanie ---------- */
$('#rand').addEventListener('click', async e => {
  const btn = e.currentTarget; if (btn.disabled) return; btn.disabled = true;
  const pick = games[Math.floor(Math.random() * games.length)], old = btn.textContent;
  for (let i = 0; i < 9; i++) { btn.textContent = games[i % games.length].name; await sleep(90); }
  btn.textContent = pick.name; await sleep(350); btn.textContent = old; btn.disabled = false; go(pick.id);
});
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || $('#player').hidden === false) return;
  const n = parseInt(e.key, 10); if (n >= 1 && n <= games.length) go(games[n - 1].id);
});

/* ---------- odtwarzacz ---------- */
const P = { id: null, token: 0, watch: [] };
const frame = $('#frame'), player = $('#player'), loading = $('#loading');
function setLoading(state, g) {
  loading.classList.toggle('done', state === 'done');
  const acts = $('#lacts'); acts.hidden = !(state === 'slow' || state === 'error');
  $('#blocks').style.display = state === 'error' ? 'none' : '';
  if (state === 'loading') { $('#ltitle').textContent = 'Ładuję: ' + g.name; $('#lmsg').textContent = 'To zajmie chwilę.'; }
  if (state === 'slow') $('#lmsg').textContent = 'Ładowanie trwa dłużej niż zwykle. Możesz poczekać albo otworzyć grę w nowej karcie.';
  if (state === 'error') { $('#ltitle').textContent = 'Gra się nie załadowała'; $('#lmsg').textContent = 'Sprawdź internet i spróbuj jeszcze raz albo otwórz grę w nowej karcie.'; }
  if (state === 'redirect') { $('#ltitle').textContent = 'Przenoszę do gry'; $('#lmsg').textContent = 'Ta gra nie pozwala na osadzenie, więc otworzę ją na jej własnej stronie.'; }
}
function clearWatch() { P.watch.forEach(clearTimeout); P.watch = []; }
function loadFrame(g) {
  const tok = ++P.token; clearWatch(); setLoading('loading', g);
  $('#blocks').style.setProperty('--c', g.color); loading.style.setProperty('--c', g.color);
  frame.onload = () => {
    if (tok !== P.token) return; clearWatch(); setLoading('done');
    try { frame.focus(); frame.contentWindow.focus(); } catch (e) { /* cross-origin */ }
  };
  frame.src = g.url;
  P.watch.push(setTimeout(() => { if (tok === P.token) setLoading('slow', g); }, 9000));
  P.watch.push(setTimeout(() => { if (tok === P.token) setLoading('error', g); }, 30000));
}
function openGame(g) {
  const same = P.id === g.id && !player.hidden;
  P.id = g.id; setLast(g.id);
  document.documentElement.classList.add('playing'); player.hidden = false; $('#home').inert = true;
  $('#ptitle').textContent = g.name; $('#ctltext').textContent = g.controls || 'Sterowanie znajdziesz w menu gry.';
  $('#ctlbox').hidden = true; $('#bInfo').setAttribute('aria-expanded', 'false');
  document.title = g.name + ' - funnn.site';
  if (same) return;
  loadFrame(g);
  // równolegle sprawdź po stronie serwera, czy gra pozwala na osadzenie
  const tok = P.token;
  fetch('/api/check?id=' + encodeURIComponent(g.id)).then(r => (r.ok ? r.json() : null)).catch(() => null).then(res => {
    if (res && res.ok === false && tok === P.token && P.id === g.id) {
      clearWatch(); frame.onload = null; const t2 = ++P.token; setLoading('redirect', g);
      setTimeout(() => { if (t2 === P.token) location.href = g.url; }, 1300);
    }
  });
}
function closeGame() {
  clearWatch(); P.token++; P.id = null;
  frame.onload = null; frame.src = 'about:blank';
  if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) { /* ignore */ } }
  player.hidden = true; player.classList.remove('barless'); $('#peek').hidden = true;
  document.documentElement.classList.remove('playing'); $('#home').inert = false; document.title = 'funnn.site - gry w klockowym stylu';
}
function render() {
  const id = routeId(), g = byId(id);
  if (g) { stopPreview(); openGame(g); return; }
  if (id) { try { history.replaceState({}, '', '/'); } catch (e) { location.hash = ''; } }
  const wasPlaying = !player.hidden;
  if (wasPlaying) closeGame();
  if (wasPlaying || !$('#grid').children.length) renderHome();
}

$('#bInfo').addEventListener('click', e => { const b = $('#ctlbox'); b.hidden = !b.hidden; e.currentTarget.setAttribute('aria-expanded', String(!b.hidden)); });
$('#bReload').addEventListener('click', () => { const g = byId(P.id); if (g) loadFrame(g); });
$('#bTab').addEventListener('click', () => { const g = byId(P.id); if (g) window.open(g.url, '_blank', 'noopener'); });
$('#lTab').addEventListener('click', () => { const g = byId(P.id); if (g) window.open(g.url, '_blank', 'noopener'); });
$('#lRetry').addEventListener('click', () => { const g = byId(P.id); if (g) loadFrame(g); });
$('#bHide').addEventListener('click', () => { player.classList.add('barless'); $('#peek').hidden = false; });
$('#peek').addEventListener('click', () => { player.classList.remove('barless'); $('#peek').hidden = true; });
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
  $('#bFull').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen(); else (player.requestFullscreen || player.webkitRequestFullscreen).call(player).catch(() => {});
  });
} else { $('#bFull').hidden = true; }

/* ---------- start ---------- */
(async () => {
  try {
    const r = await fetch('/games.json', { cache: 'no-cache' });
    if (r.ok) { const list = await r.json(); if (Array.isArray(list) && list.length) games = list; }
  } catch (e) { /* zostaje lista wbudowana */ }
  render();
})();
})();
</script>
