<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smiri</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand"><span class="orb mini"></span><b>smiri</b></div>
    <button id="newChat" class="side-btn primary"><i data-ic="plus"></i>Nowy czat</button>
    <button id="tempChat" class="side-btn"><i data-ic="hourglass"></i>Czat tymczasowy</button>

    <div class="side-title">Persona</div>
    <div class="row2">
      <select id="personaSel"></select>
      <button id="personaNew" class="side-btn sq" title="Stwórz własnego bota"><i data-ic="plus"></i></button>
      <button id="personaEdit" class="side-btn sq" title="Edytuj"><i data-ic="pencil"></i></button>
    </div>

    <div class="side-title">Narzędzia</div>
    <div class="tool-grid" id="toolGrid"></div>

    <div class="side-title">Historia</div>
    <div id="chatList"></div>
    <div class="side-foot">
      <button id="settingsBtn" class="side-btn"><i data-ic="sliders"></i>Ustawienia</button>
      <small>Ctrl/⌘ + K — pole pisania</small>
    </div>
  </aside>

  <main>
    <header>
      <button id="menuBtn" class="icon"><i data-ic="menu"></i></button>
      <div id="chatTitle">Nowy czat</div>
      <span id="personaBadge" class="badge soft"></span>
      <span id="tempBadge" class="badge" hidden>tymczasowy — zniknie po wyjściu</span>
      <div class="spacer"></div>
      <button id="searchBtn" class="pill on" title="Wyszukiwanie w internecie"><i data-ic="globe"></i><span>Sieć</span></button>
      <button id="wakeBtn" class="pill" title="Nasłuchuj „Hey Smiri”"><i data-ic="mic"></i><span>Hey Smiri</span></button>
    </header>

    <div id="messages"></div>

    <div id="composer">
      <div class="chips small" id="tools"></div>
      <div id="attachments" class="chips small"></div>
      <div class="box">
        <button id="attachBtn" class="icon" title="Dodaj plik, zdjęcie lub PDF"><i data-ic="clip"></i></button>
        <input id="file" type="file" multiple hidden accept="image/*,application/pdf,.txt,.md,.csv,.json,.js,.py,.html,.css">
        <textarea id="input" rows="1" placeholder="Zapytaj Smiri o cokolwiek…"></textarea>
        <button id="micBtn" class="icon" title="Mów"><i data-ic="mic"></i></button>
        <button id="sendBtn" class="send" title="Wyślij"><i data-ic="up"></i></button>
      </div>
      <small class="hint">Smiri może się mylić. Sprawdzaj ważne informacje. Pliki do ok. 3 MB łącznie.</small>
    </div>
  </main>
  <div id="scrim"></div>
</div>

<div id="voice" hidden>
  <div class="orb huge listening"></div>
  <div id="voiceText">Słucham…</div>
  <button id="voiceClose" class="pill">Zamknij</button>
</div>

<!-- ustawienia -->
<dialog id="settings">
  <form method="dialog">
    <h2>Ustawienia</h2>
    <label>Model
      <select id="model">
        <option value="claude-sonnet-5-5">Sonnet 5.5 — domyślny</option>
        <option value="claude-haiku-5-5">Haiku 5.5 — najtańszy</option>
      </select>
    </label>
    <label>Kod dostępu (jeśli jest wymagany)
      <input id="password" type="password" autocomplete="off">
    </label>
    <label>Wygląd
      <select id="theme"><option value="auto">Automatyczny (jak system)</option><option value="light">Jasny</option><option value="dark">Ciemny</option></select>
    </label>
    <label>Język głosu
      <select id="lang"><option value="pl-PL">Polski</option><option value="en-US">English</option></select>
    </label>
    <label class="row"><input id="speak" type="checkbox"> Czytaj odpowiedzi na głos</label>
    <menu>
      <button id="clearAll" type="button" class="danger">Usuń całą historię</button>
      <button id="saveSettings" value="ok" class="primary">Zapisz</button>
    </menu>
  </form>
</dialog>

<!-- edytor persony -->
<dialog id="personaDlg">
  <form method="dialog">
    <h2 id="personaTitle">Własny czat</h2>
    <div id="pIcons" class="icon-pick"></div>
    <div class="row2"><input id="pName" type="text" placeholder="Nazwa, np. Korepetytor matematyki"></div>
    <label>Jak ma się zachowywać? Wklej instrukcje
      <textarea id="pPrompt" rows="9" placeholder="Jesteś cierpliwym korepetytorem matematyki. Tłumaczysz krok po kroku, zadajesz pytania kontrolne, nie podajesz od razu wyniku…"></textarea>
    </label>
    <label>Powitanie (opcjonalnie — pierwsza wiadomość bota)
      <input id="pGreet" type="text" placeholder="Cześć! Z czym pomóc?">
    </label>
    <label>Model dla tej persony
      <select id="pModel"><option value="">— domyślny z ustawień —</option>
        <option value="claude-sonnet-5-5">Sonnet 5.5</option><option value="claude-haiku-5-5">Haiku 5.5</option></select>
    </label>
    <menu>
      <span>
        <button id="pDelete" type="button" class="danger">Usuń</button>
        <button id="pExport" type="button" class="ghost">Kopiuj JSON</button>
        <button id="pImport" type="button" class="ghost">Importuj</button>
      </span>
      <span><button value="cancel" class="ghost">Anuluj</button> <button id="pSave" value="ok" class="primary">Zapisz</button></span>
    </menu>
  </form>
</dialog>

<!-- panel narzędzi -->
<dialog id="panel" class="big">
  <div class="panel-head"><h2 id="panelTitle"></h2><button id="panelClose" class="icon"><i data-ic="close"></i></button></div>
  <div id="panelBody"></div>
</dialog>

<script src="icons.js"></script>
<script src="features.js"></script>
<script src="app.js"></script>
</body>
</html>
