<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<script>try{var s=JSON.parse(localStorage.getItem("smiri.settings")||"{}"),t=(s.themeSet&&s.theme)||"dark";if(t!=="auto")document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Smiri</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smiri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.0.2/lib/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body>
<div id="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="edgeGlow" aria-hidden="true"></div>
<div class="app">
  <aside id="sidebar">
    <div class="sb-top">
      <div class="brand"><span class="orb mini"></span><b>smiri</b></div>
      <button id="sbClose" class="icon only-mobile" aria-label="Zamknij"><i data-ic="close"></i></button>
      <button id="sbCollapse" class="icon only-desktop" aria-label="Zwiń pasek boczny" title="Zwiń pasek boczny"><i data-ic="panel"></i></button>
    </div>
    <button id="newChat" class="btn-new"><i data-ic="plus"></i>Nowy czat</button>
    <nav class="side-nav">
      <button id="projBtn" class="row-btn"><i data-ic="folder"></i>Projekty</button>
      <button id="artLibBtn" class="row-btn"><i data-ic="layers"></i>Artefakty</button>
      <button id="schedBtn" class="row-btn"><i data-ic="clock"></i>Zaplanowane</button>
      <button id="custBtn" class="row-btn"><i data-ic="user"></i>Dostosuj</button>
      <button id="moreBtn" class="row-btn more-row" aria-expanded="false"><i data-ic="chevron"></i>Więcej</button>
      <div id="moreBox" hidden>
        <button id="toolsBtn" class="row-btn sub"><i data-ic="grid"></i>Narzędzia</button>
        <button id="tempChat" class="row-btn sub"><i data-ic="hourglass"></i>Czat tymczasowy</button>
        <button id="palBtn2" class="row-btn sub"><i data-ic="command"></i>Paleta poleceń</button>
      </div>
    </nav>
    <div class="search-box"><i data-ic="search"></i><input id="chatSearch" type="search" placeholder="Szukaj w rozmowach" autocomplete="off"></div>
    <div id="chatList"></div>
    <div class="side-foot userbar">
      <button id="userBtn" class="user-row"><span class="avatar" id="avatar">G</span><span id="userName">Gość</span></button>
      <button id="settingsBtn" class="icon" aria-label="Ustawienia" title="Ustawienia"><i data-ic="sliders"></i></button>
      <button id="palBtn" class="icon" aria-label="Szukaj i polecenia" title="Szukaj (Ctrl/⌘ K)"><i data-ic="search"></i></button>
    </div>
  </aside>

  <main>
    <header>
      <button id="menuBtn" class="icon only-mobile" aria-label="Menu"><i data-ic="menu"></i></button>
      <button id="personaPill" class="persona-pill" aria-haspopup="true"><span id="ppIcon"></span><span id="ppName">Smiri</span><i data-ic="chevron"></i></button>
      <button id="projBadge" class="badge proj" hidden></button>
      <span id="tempBadge" class="badge" hidden>Tymczasowy</span>
      <div class="spacer"></div>
      <button id="searchBtn" class="hbtn on" title="Wyszukiwanie w internecie"><i data-ic="globe"></i><span>Sieć</span></button>
      <button id="wakeBtn" class="hbtn" title="Nasłuchuj „Hey Smiri”"><i data-ic="mic"></i><span>Hey Smiri</span></button>
      <button id="newTop" class="icon only-mobile" aria-label="Nowy czat"><i data-ic="pencil"></i></button>
    </header>

    <div id="messages"></div>
    <button id="toBottom" class="to-bottom" hidden aria-label="Na dół"><i data-ic="down"></i></button>

    <div id="composer">
      <div id="attachments"></div>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Zapytaj Smiri o cokolwiek" enterkeyhint="send"></textarea>
        <input id="file" type="file" multiple hidden accept="image/*,application/pdf,.txt,.md,.csv,.json,.js,.py,.html,.css">
        <input id="fileCam" type="file" hidden accept="image/*" capture="environment">
        <div class="box-row">
          <button id="plusBtn" class="cbtn" aria-label="Dodaj"><i data-ic="plus"></i></button>
          <div class="seg mode" id="modeSeg"><button type="button" data-m="chat" class="on">Czat</button><button type="button" data-m="research">Badanie</button></div>
          <span class="grow"></span>
          <button id="modelBtn" class="model-btn" aria-haspopup="true"><span id="modelLbl">Sonnet 5.5</span><i data-ic="chevron"></i></button>
          <button id="dictBtn" class="cbtn" aria-label="Dyktowanie" title="Dyktowanie"><i data-ic="mic"></i></button>
          <button id="micBtn" class="cbtn" aria-label="Rozmowa głosowa" title="Rozmowa głosowa"><i data-ic="wave"></i></button>
          <button id="sendBtn" class="send" aria-label="Wyślij"><i data-ic="up"></i></button>
        </div>
      </div>
      <small class="hint">Smiri może się mylić. Sprawdzaj ważne informacje.</small>
    </div>
  </main>
  <aside id="artPanel" hidden></aside>
  <div id="waves" aria-hidden="true"></div>
  <div id="scrim"></div>
</div>

<div id="pop" class="popover" hidden></div>
<div id="palette" hidden>
  <div class="pal">
    <div class="pal-in"><i data-ic="search"></i><input id="palInput" type="text" placeholder="Szukaj rozmów, poleceń i narzędzi lub zapytaj Smiri" autocomplete="off"><kbd>esc</kbd></div>
    <div id="palList"></div>
  </div>
</div>
<select id="personaSel" hidden></select>

<div id="voice" hidden>
  <div class="orb huge listening"></div>
  <div id="voiceText">Słucham…</div>
  <div class="voice-acts"><button id="convoBtn" class="pill-btn"><i data-ic="mic"></i> Rozmowa ciągła: wył.</button><button id="voiceClose" class="pill-btn">Zamknij</button></div>
</div>

<!-- narzędzia: ekran z kafelkami -->
<dialog id="launcher" class="sheet">
  <div class="sheet-head"><h2>Narzędzia</h2><button class="icon" data-close aria-label="Zamknij"><i data-ic="close"></i></button></div>
  <div id="launcherGrid" class="launcher"></div>
</dialog>

<!-- ustawienia -->
<dialog id="settings" class="sheet big">
  <form method="dialog">
    <div class="sheet-head"><h2>Ustawienia</h2></div>
    <h3 class="sec">Model i odpowiedzi</h3>
    <div class="field"><label for="model">Model</label>
      <select id="model"><option value="claude-sonnet-5-5">Sonnet 5.5 — domyślny</option><option value="claude-haiku-5-5">Haiku 5.5 — najszybszy</option></select></div>
    <div class="field"><label for="effort">Głębokość myślenia</label>
      <select id="effort"><option value="low">Szybka</option><option value="medium">Zrównoważona</option><option value="high">Dokładna</option></select></div>
    <label class="switch-row"><span>Pokazuj tok rozumowania<small>Podgląd tego, jak Smiri myśli</small></span><input id="showThink" type="checkbox" class="switch"></label>
    <div class="field"><label for="style">Styl odpowiedzi</label>
      <select id="style"><option value="default">Domyślny</option><option value="concise">Zwięzły</option><option value="explain">Wyjaśniający</option><option value="formal">Formalny</option><option value="casual">Luźny</option></select></div>
    <h3 class="sec" id="secPersonal">Personalizacja</h3>
    <div class="field"><label for="userNameIn">Twoje imię</label><input id="userNameIn" type="text" placeholder="Jak mam się do Ciebie zwracać?" autocomplete="off"></div>
    <div class="field"><label for="aboutMe">Co Smiri powinien o Tobie wiedzieć?</label><textarea id="aboutMe" rows="3" placeholder="Np. Jestem programistą z Krakowa, uczę się hiszpańskiego."></textarea></div>
    <div class="field"><label for="howRespond">Jak ma odpowiadać?</label><textarea id="howRespond" rows="3" placeholder="Np. Odpowiadaj krótko, z przykładami kodu w TypeScript."></textarea></div>
    <label class="switch-row"><span>Pamięć między rozmowami<small>Smiri zapamiętuje trwałe fakty o Tobie</small></span><input id="memOn" type="checkbox" class="switch"></label>
    <div id="memList"></div>
    <button id="clearMem" type="button" class="btn-danger sm">Wyczyść pamięć</button>
    <h3 class="sec">Wygląd i odczucia</h3>
    <div class="field"><label>Kolor akcentu</label><div id="accentPick" class="accent-pick"></div></div>
    <div class="field"><label for="fsize">Rozmiar tekstu w rozmowie</label>
      <select id="fsize"><option value="s">Mały</option><option value="m">Średni</option><option value="l">Duży</option></select></div>
    <label class="switch-row"><span>Wibracje<small>Delikatne dotknięcia przy akcjach (Android)</small></span><input id="haptics" type="checkbox" class="switch"></label>
    <label class="switch-row"><span>Rozmowa ciągła<small>Po odpowiedzi Smiri słucha dalej, bez dotykania</small></span><input id="convo" type="checkbox" class="switch"></label>
    <button id="installBtn" type="button" class="btn-ghost" style="margin-top:6px">Zainstaluj jako aplikację</button>
    <h3 class="sec">Ogólne</h3>
    <div class="field"><label for="theme">Wygląd</label>
      <select id="theme"><option value="auto">Automatyczny</option><option value="light">Jasny</option><option value="dark">Ciemny</option></select></div>
    <div class="field"><label for="lang">Język głosu</label>
      <select id="lang"><option value="pl-PL">Polski</option><option value="en-US">English</option></select></div>
    <label class="switch-row"><span>Czytaj odpowiedzi na głos</span><input id="speak" type="checkbox" class="switch"></label>
    <div class="field"><label for="password">Kod dostępu (jeśli jest wymagany)</label><input id="password" type="password" autocomplete="off"></div>
    <div class="kbd-help"><b>Skróty:</b> <kbd>⌘/Ctrl K</kbd> paleta poleceń · <kbd>⌘/Ctrl ⇧ O</kbd> nowy czat · <kbd>/</kbd> pole pisania · <kbd>Esc</kbd> zamknij</div>
    <div class="sheet-actions">
      <button id="clearAll" type="button" class="btn-danger">Usuń historię</button>
      <button id="saveSettings" value="ok" class="btn-primary">Gotowe</button>
    </div>
  </form>
</dialog>

<!-- biblioteka artefaktów -->
<dialog id="artlib" class="sheet big">
  <div class="sheet-head"><h2>Artefakty</h2><button class="icon" data-close aria-label="Zamknij"><i data-ic="close"></i></button></div>
  <div id="artlibBody"></div>
</dialog>

<!-- zadania zaplanowane -->
<dialog id="sched" class="sheet big">
  <div class="sheet-head"><h2>Zaplanowane</h2><button class="icon" data-close aria-label="Zamknij"><i data-ic="close"></i></button></div>
  <div id="schedBody"></div>
</dialog>

<!-- projekty -->
<dialog id="projects" class="sheet big">
  <div class="sheet-head"><h2 id="projTitle">Projekty</h2><button class="icon" data-close aria-label="Zamknij"><i data-ic="close"></i></button></div>
  <div id="projBody"></div>
</dialog>

<!-- edytor persony -->
<dialog id="personaDlg" class="sheet">
  <form method="dialog">
    <div class="sheet-head"><h2 id="personaTitle">Własny czat</h2></div>
    <div id="pIcons" class="icon-pick"></div>
    <div class="field"><label for="pName">Nazwa</label><input id="pName" type="text" placeholder="np. Korepetytor matematyki"></div>
    <div class="field"><label for="pPrompt">Jak ma się zachowywać? Wklej instrukcje</label>
      <textarea id="pPrompt" rows="7" placeholder="Jesteś cierpliwym korepetytorem matematyki. Tłumaczysz krok po kroku, zadajesz pytania kontrolne, nie podajesz od razu wyniku…"></textarea></div>
    <div class="field"><label for="pGreet">Powitanie (opcjonalnie)</label><input id="pGreet" type="text" placeholder="Cześć! Z czym pomóc?"></div>
    <div class="field"><label for="pModel">Model tej persony</label>
      <select id="pModel"><option value="">Domyślny z ustawień</option><option value="claude-sonnet-5-5">Sonnet 5.5</option><option value="claude-haiku-5-5">Haiku 5.5</option></select></div>
    <div class="sheet-actions wrap">
      <span class="grp"><button id="pDelete" type="button" class="btn-danger">Usuń</button>
      <button id="pExport" type="button" class="btn-ghost">Kopiuj JSON</button>
      <button id="pImport" type="button" class="btn-ghost">Importuj</button></span>
      <span class="grp"><button value="cancel" class="btn-ghost">Anuluj</button><button id="pSave" value="ok" class="btn-primary">Zapisz</button></span>
    </div>
  </form>
</dialog>

<!-- panel narzędzia -->
<dialog id="panel" class="sheet big">
  <div class="sheet-head"><h2 id="panelTitle"></h2><button id="panelClose" class="icon" aria-label="Zamknij"><i data-ic="close"></i></button></div>
  <div id="panelBody"></div>
</dialog>

<script src="icons.js"></script>
<script src="ui.js"></script>
<script src="features.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
<script src="extras2.js"></script>
</body>
</html>
